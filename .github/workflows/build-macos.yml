name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile Swift application
        run: |
          set -euo pipefail
          swift build --configuration release
      - name: Package macOS application
        run: |
          set -euo pipefail
          APP="dist/Liberty Plugin Artwork Creator.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/release/LibertyPluginArtworkCreator "$APP/Contents/MacOS/LibertyPluginArtworkCreator"
          chmod +x "$APP/Contents/MacOS/LibertyPluginArtworkCreator"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>fr</string>
            <key>CFBundleExecutable</key><string>LibertyPluginArtworkCreator</string>
            <key>CFBundleIdentifier</key><string>com.libertymusicsoftware.pluginartworkcreator</string>
            <key>CFBundleName</key><string>Liberty Plugin Artwork Creator</string>
            <key>CFBundleDisplayName</key><string>Liberty Plugin Artwork Creator</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --sign - --timestamp=none "$APP"
          ditto -c -k --keepParent "$APP" dist/Liberty-Plugin-Artwork-Creator-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Liberty-Plugin-Artwork-Creator-macOS-arm64
          path: dist/Liberty-Plugin-Artwork-Creator-macOS-arm64.zip
          if-no-files-found: error
